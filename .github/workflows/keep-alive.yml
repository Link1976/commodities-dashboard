name: Keep HF Space alive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space
        run: |
          curl -fsSL --max-time 60 https://occam1976-commodities-dashboard.hf.space/ -o /dev/null
          echo "Pinged at $(date -u)"
